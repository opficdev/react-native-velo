name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 배포 직전까지만 실행
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node

      - name: Read version
        id: version
        env:
          MISE_AUTO_INSTALL: 0
        run: echo "version=$(mise exec -- node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Require tag for publishing
        if: github.ref_type != 'tag' && !inputs.dry_run
        run: |
          echo "::error::태그가 아닌 ref에서는 dry_run만 실행할 수 있음"
          exit 1

      - name: Verify tag and branch
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 package.json 버전 $VERSION 이 다름"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그 커밋이 main 에 포함되어 있지 않음"
            exit 1
          fi

      - name: Check published version
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" --json assets --jq '.assets[].name' 2> /dev/null | grep -qxF "react-native-velo-$VERSION.tgz"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  pack:
    name: Pack
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'example/package-lock.json') }}

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Pack
        env:
          MISE_AUTO_INSTALL: 0
        run: make pack

      - name: Check package contents
        env:
          MISE_AUTO_INSTALL: 0
        run: make pack-check

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: /tmp/velo-pack/*.tgz
          if-no-files-found: error

  install-ios:
    name: Installed package iOS build
    needs: pack
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node and Ruby
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node ruby

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'example/package-lock.json') }}

      - name: Install dependencies
        run: |
          mise exec -- npm ci
          cd example && mise exec -- npm ci

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/pack

      - name: Install package into example
        env:
          MISE_AUTO_INSTALL: 0
        run: make install-pack PACK_DIR="$RUNNER_TEMP/pack"

      - name: Generate Nitro code of example producer
        env:
          MISE_AUTO_INSTALL: 0
        run: make codegen-producer

      - name: Install Pods
        env:
          MISE_AUTO_INSTALL: 0
        run: make pods

      - name: Build
        env:
          MISE_AUTO_INSTALL: 0
        run: make build-ios

  install-android:
    name: Installed package Android build
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node and Java
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node java

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'example/package-lock.json') }}

      - name: Install dependencies
        run: |
          mise exec -- npm ci
          cd example && mise exec -- npm ci

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/pack

      - name: Install package into example
        env:
          MISE_AUTO_INSTALL: 0
        run: make install-pack PACK_DIR="$RUNNER_TEMP/pack"

      - name: Generate Nitro code of example producer
        env:
          MISE_AUTO_INSTALL: 0
        run: make codegen-producer

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Build
        env:
          MISE_AUTO_INSTALL: 0
        run: make build-android

  publish:
    name: Publish
    needs: [verify, ci, pack, install-ios, install-android]
    if: needs.verify.outputs.published != 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/pack

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: gh release create "$VERSION" "$RUNNER_TEMP"/pack/*.tgz --verify-tag --title "$VERSION" --generate-notes

  release-issues:
    name: Release issues
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull: ${{ steps.extract.outputs.pull }}
      issues: ${{ steps.extract.outputs.issues }}
    steps:
      - name: Extract issues from release pull request
        id: extract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "first(.[] | select(.base.ref == \"main\" and .merge_commit_sha == \"$GITHUB_SHA\")) | .number")
          if [ -z "$pull" ]; then
            echo "::warning::$GITHUB_SHA 를 병합 커밋으로 가진 main 대상 PR이 없어 닫을 이슈를 찾지 못함"
            echo "릴리스 PR을 찾지 못해 닫을 이슈 없음" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          issues=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull" --jq .body \
            | perl -0777 -ne 's/```.*?```//gs; s/~~~.*?~~~//gs; s/<!--.*?-->//gs; s/`[^`\n]*`//g; s/^[ \t]*>.*$//gm; print "$1\n" while /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?[ \t]+#(\d+)\b/gi' \
            | sort -un \
            | paste -sd ' ' -)
          echo "pull=$pull" >> "$GITHUB_OUTPUT"
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          if [ -z "$issues" ]; then
            echo "::notice::릴리스 PR #$pull 의 본문에 닫기 키워드가 없음"
            echo "릴리스 PR #$pull 의 본문에 닫을 이슈 없음" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "릴리스 PR #$pull 에서 닫을 이슈: $issues"
            echo "릴리스 PR #$pull 에서 닫을 이슈: $issues" >> "$GITHUB_STEP_SUMMARY"
          fi

  close-issue:
    name: Close issues
    needs: [verify, publish, release-issues]
    if: needs.publish.result == 'success' && needs.release-issues.outputs.issues != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Close issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          PULL: ${{ needs.release-issues.outputs.pull }}
          ISSUES: ${{ needs.release-issues.outputs.issues }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          failed=0
          {
            echo "| 이슈 | 결과 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for issue in $ISSUES; do
            if ! info=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '[.state, (.pull_request != null)] | @tsv' 2>&1); then
              case "$info" in
                *"HTTP 404"* | *"HTTP 410"*)
                  echo "::warning::#$issue 를 찾을 수 없어 건너뜀"
                  echo "| #$issue | 건너뜀: 없음 |" >> "$GITHUB_STEP_SUMMARY"
                  ;;
                *)
                  echo "::error::#$issue 조회 실패: $info"
                  echo "| #$issue | 실패: 조회 |" >> "$GITHUB_STEP_SUMMARY"
                  failed=1
                  ;;
              esac
              continue
            fi
            read -r state is_pull <<< "$info"
            if [ "$is_pull" = true ]; then
              echo "::warning::#$issue 는 PR이라 건너뜀"
              echo "| #$issue | 건너뜀: PR |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "$state" = closed ]; then
              echo "::notice::#$issue 는 이미 닫혀 있어 건너뜀"
              echo "| #$issue | 건너뜀: 이미 닫힘 |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if ! comments=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments" --paginate --jq '.[].body'); then
              echo "::error::#$issue 댓글 조회 실패"
              echo "| #$issue | 실패: 댓글 조회 |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            case "$comments" in
              *"($url)"*) ;;
              *)
                if ! gh issue comment "$issue" --body "[$VERSION]($url) 배포 완료로 릴리스 PR #${PULL}에 따라 닫음"; then
                  echo "::error::#$issue 댓글 작성 실패"
                  echo "| #$issue | 실패: 댓글 작성 |" >> "$GITHUB_STEP_SUMMARY"
                  failed=1
                  continue
                fi
                ;;
            esac
            if gh issue close "$issue" --reason completed; then
              echo "| #$issue | 닫음 |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::#$issue 닫기 실패"
              echo "| #$issue | 실패: 닫기 |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"
