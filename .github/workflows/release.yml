name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 배포 직전까지만 실행
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node

      - name: Read version
        id: version
        env:
          MISE_AUTO_INSTALL: 0
        run: echo "version=$(mise exec -- node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Require tag for publishing
        if: github.ref_type != 'tag' && !inputs.dry_run
        run: |
          echo "::error::태그가 아닌 ref에서는 dry_run만 실행할 수 있음"
          exit 1

      - name: Verify tag and branch
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 package.json 버전 $VERSION 이 다름"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그 커밋이 main 에 포함되어 있지 않음"
            exit 1
          fi

      - name: Check published version
        id: published
        env:
          MISE_AUTO_INSTALL: 0
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if mise exec -- npm view "react-native-velo@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  pack:
    name: Pack
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'example/package-lock.json') }}

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Pack
        env:
          MISE_AUTO_INSTALL: 0
        run: make pack

      - name: Check package contents
        env:
          MISE_AUTO_INSTALL: 0
        run: make pack-check

      - name: Publish dry run
        env:
          MISE_AUTO_INSTALL: 0
        run: mise exec -- npm publish "$(ls /tmp/velo-pack/*.tgz)" --dry-run

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: /tmp/velo-pack/*.tgz
          if-no-files-found: error

  install-ios:
    name: Installed package iOS build
    needs: pack
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node and Ruby
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node ruby

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'example/package-lock.json') }}

      - name: Install dependencies
        run: |
          mise exec -- npm ci
          cd example && mise exec -- npm ci

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/pack

      - name: Install package into example
        env:
          MISE_AUTO_INSTALL: 0
        run: make install-pack PACK_DIR="$RUNNER_TEMP/pack"

      - name: Generate Nitro code of example producer
        env:
          MISE_AUTO_INSTALL: 0
        run: make codegen-producer

      - name: Install Pods
        env:
          MISE_AUTO_INSTALL: 0
        run: make pods

      - name: Build
        env:
          MISE_AUTO_INSTALL: 0
        run: make build-ios

  install-android:
    name: Installed package Android build
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node and Java
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node java

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'example/package-lock.json') }}

      - name: Install dependencies
        run: |
          mise exec -- npm ci
          cd example && mise exec -- npm ci

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/pack

      - name: Install package into example
        env:
          MISE_AUTO_INSTALL: 0
        run: make install-pack PACK_DIR="$RUNNER_TEMP/pack"

      - name: Generate Nitro code of example producer
        env:
          MISE_AUTO_INSTALL: 0
        run: make codegen-producer

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Build
        env:
          MISE_AUTO_INSTALL: 0
        run: make build-android

  publish:
    name: Publish
    needs: [verify, ci, pack, install-ios, install-android]
    if: needs.verify.outputs.published != 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: false
          install_args: node

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/pack

      - name: Publish
        env:
          MISE_AUTO_INSTALL: 0
        run: mise exec -- npm publish "$(ls "$RUNNER_TEMP"/pack/*.tgz)" --provenance --access public
